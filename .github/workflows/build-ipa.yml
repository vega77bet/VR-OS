name: Build VR OS IPA
on:
  workflow_dispatch:
  push:
    branches: [main, vr-os-2-handtracking, vr-os-3-full-hand, vr-os-3-spatial-depth, vr-os-3-online-updates, vr-os-3-space-360, vr-os-3-depth-fix, vr-os-4-four-themes, vr-os-4-pinch-stability, vr-os-4-pinch-lock, vr-os-4-dock-depth-fix, vr-os-4-external-z-reachable-dock, vr-os-5-spatial-grab-handle, vr-os-6-imax-cinema, vr-os-7-imax-ultra-v2, vr-os-8-stereo-3d-cinema, vr-os-9-photos-internet-updates, vr-os-10-cinema-head-controls-fix, vr-os-11-cinema-seat-selection, vr-os-12-floating-web-apps, vr-os-13-web-fov-fix, vr-os-14-cinema-camera-fix, vr-os-15-cinema-tracking-calibration, vr-os-16-stability-immersive-fixes, vr-os-17-window-scroll-audit, vr-os-18-real-ultrawide-camera, vr-os-19-ultrawide-hand-head-tracking]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test gesture and window geometry
        run: |
          swiftc VROS/VRGestureGeometry.swift VROS/VRCinemaGeometry.swift VROS/VRUltraWideWindowProjection.swift VROS/VRPinchDetector.swift Tests/main.swift -o "$RUNNER_TEMP/vros-geometry-tests"
          "$RUNNER_TEMP/vros-geometry-tests"
      - name: Build unsigned app
        run: |
          xcodebuild -project VROS.xcodeproj -scheme VROS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VROS.app Payload/
          zip -qry VR-OS-19-Ultra-Tracking-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VR-OS-19-Ultra-Tracking-unsigned-IPA
          path: VR-OS-19-Ultra-Tracking-unsigned.ipa
          retention-days: 14
