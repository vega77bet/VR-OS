name: Build VR OS IPA
on:
  workflow_dispatch:
  push:
    branches: [main, vr-os-2-handtracking, vr-os-3-full-hand, vr-os-3-spatial-depth]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project VROS.xcodeproj -scheme VROS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VROS.app Payload/
          zip -qry VR-OS-3-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VR-OS-3-unsigned-IPA
          path: VR-OS-3-unsigned.ipa
          retention-days: 14
