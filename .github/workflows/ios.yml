name: VR-OS 2 native validation
on:
  push:
    branches: [vr-os-2]
  pull_request:
    branches: [main, vr-os-2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate clean native project
        run: xcodegen generate
      - name: Build iPhone device app (no signing)
        run: >-
          xcodebuild -project VROS.xcodeproj -scheme VROS -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Run core math and persistence directly on macOS
        run: >-
          xcodebuild -project VROS.xcodeproj -scheme VROSMath -configuration Debug
          -destination 'platform=macOS' -parallel-testing-enabled NO
          -derivedDataPath build/math -resultBundlePath build/MathTests.xcresult test
      - name: Run orientation, stereo, calibration and lifecycle tests
        timeout-minutes: 12
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project VROS.xcodeproj -scheme VROS -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - name: Simulator diagnostics on failure
        if: failure()
        timeout-minutes: 2
        run: |
          xcrun simctl list devices booted
          if [ -d build/simulator/Build/Products/Debug-iphonesimulator/VROS.app ]; then
            codesign -dv build/simulator/Build/Products/Debug-iphonesimulator/VROS.app
          fi
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VROS-native-build-evidence
          path: |
            build/Tests.xcresult
            build/MathTests.xcresult
            build/device/Build/Products/Release-iphoneos/VROS.app
            VROS.xcodeproj
          retention-days: 14
