name: VR-OS 2 spatial Home validation
on:
  push:
    branches: [vr-os-2-stage-2]
  pull_request:
    branches: [main, vr-os-2, vr-os-2-stage-2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate clean native project
        run: xcodegen generate
      - name: Build iPhone device app (no signing)
        run: >-
          xcodebuild -project VROS.xcodeproj -scheme VROS -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Run core math and persistence directly on macOS
        run: >-
          xcodebuild -project VROS.xcodeproj -scheme VROSMath -configuration Debug
          -destination 'platform=macOS' -parallel-testing-enabled NO
          -derivedDataPath build/math -resultBundlePath build/MathTests.xcresult test
      - name: Run iOS engine, spatial interaction and Metal tests
        timeout-minutes: 12
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project VROS.xcodeproj -scheme VROS -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - name: Export actual GPU test captures
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/attachments
            xcrun xcresulttool get test-results summary --path build/Tests.xcresult > build/ios-summary.json
          fi
          if [ -d build/MathTests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/MathTests.xcresult > build/math-summary.json
          fi
      - name: Package unsigned IPA for sideload signing
        if: success()
        run: |
          APP_PATH="build/device/Build/Products/Release-iphoneos/VROS.app"
          test -d "$APP_PATH"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/VROS.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/VROS-unsigned.ipa
          shasum -a 256 build/VROS-unsigned.ipa > build/VROS-unsigned.ipa.sha256
      - name: Simulator diagnostics on failure
        if: failure()
        timeout-minutes: 2
        run: |
          xcrun simctl list devices booted
          if [ -d build/simulator/Build/Products/Debug-iphonesimulator/VROS.app ]; then
            codesign -dv build/simulator/Build/Products/Debug-iphonesimulator/VROS.app
          fi
      - name: Upload unsigned IPA only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VROS-vision-calibration-unsigned-ipa
          path: build/VROS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Shut down test simulators
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        run: xcrun simctl shutdown all
