name: VROS
options:
  bundleIdPrefix: com.vega77bet
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "50"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  VROS:
    type: application
    platform: iOS
    sources:
      - path: VROS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vega77bet.vros2
        PRODUCT_NAME: VROS
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "VR-OS"
        INFOPLIST_KEY_NSMotionUsageDescription: "O VR-OS usa os sensores inerciais para acompanhar a rotação da cabeça."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
  VROSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VROS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vega77bet.vros2.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VROS:
    build:
      targets:
        VROS: all
        VROSTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - VROSTests
