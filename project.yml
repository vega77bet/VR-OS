name: VROS
settings:
  base:
    MARKETING_VERSION: "7.0.0"
    CURRENT_PROJECT_VERSION: "48"
schemes:
  VROSRegression:
    build:
      targets:
        VROSRegressionTests: all
    test:
      targets:
        - VROSRegressionTests
options:
  projectFormat: xcode15_0
  xcodeVersion: "15.0"
  bundleIdPrefix: com.vega77bet
  deploymentTarget:
    iOS: "16.0"
targets:
  VROSRegressionHost:
    type: application
    platform: iOS
    sources:
      - RegressionHost
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  VROSRegressionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VROS
        excludes: [VROSApp.swift]
      - RegressionTests
    dependencies:
      - target: VROSRegressionHost
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VROSRegressionHost.app/VROSRegressionHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
  VROS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - VROS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vega77bet.vros2
        INFOPLIST_KEY_CFBundleDisplayName: "VR-OS"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "7.0.0"
        CURRENT_PROJECT_VERSION: "48"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "O VR OS usa a câmera traseira para mostrar o ambiente e rastrear as mãos e mapear o ambiente com ARKit."
        INFOPLIST_KEY_NSMotionUsageDescription: "O VR OS usa os sensores para acompanhar os movimentos da cabeça."
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGNING_ALLOWED: NO
