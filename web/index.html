<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12"><title>VR OS — Spatial Web</title>
<style>
:root{color-scheme:dark;--accent:#a4c8ff;--glass:rgba(25,31,44,.74);--stroke:rgba(255,255,255,.12);--txt:#f5f7fb;--muted:#a7adbb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#090d16;color:var(--txt);overflow:hidden;user-select:none}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#space{position:fixed;inset:0;background:radial-gradient(ellipse at 65% 35%,#243149 0%,transparent 45%),radial-gradient(ellipse at 25% 80%,#171f36 0%,transparent 45%),#090d16}#space:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.024) 1px,transparent 1px);background-size:70px 70px;mask-image:linear-gradient(transparent,black);pointer-events:none}.orb{position:absolute;width:38vw;height:38vw;max-width:540px;max-height:540px;border:1px solid rgba(190,213,255,.09);border-radius:50%;top:16%;left:38%;box-shadow:0 0 130px rgba(77,119,180,.1),inset 0 0 120px rgba(130,174,230,.06);pointer-events:none}.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 18px 70px rgba(0,0,0,.28)}#top{position:fixed;top:calc(14px + env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:100;pointer-events:none}.brand,.status{pointer-events:auto;border-radius:19px;padding:12px 17px;font-size:13px;font-weight:600}.brand b{color:var(--accent);margin-right:8px}.status{font-size:12px;color:var(--muted)}#dock{position:fixed;bottom:calc(17px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:10px;border-radius:25px;z-index:100;max-width:calc(100vw - 24px)}.dockbtn{background:none;border:0;border-radius:16px;min-width:63px;padding:9px 7px;display:grid;gap:6px;justify-items:center;font-size:10px;color:var(--muted)}.dockbtn:hover,.dockbtn.active{background:rgba(255,255,255,.09);color:white}.dockbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.dockbtn.active svg{stroke:var(--accent)}#welcome{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;width:min(480px,90vw);pointer-events:none}#welcome h1{font-size:clamp(32px,5vw,55px);font-weight:580;letter-spacing:-2px;margin:0 0 12px}#welcome p{color:var(--muted);line-height:1.6;margin:0}#windows{position:fixed;inset:0;pointer-events:none}.window{position:absolute;width:520px;height:380px;min-width:280px;min-height:240px;border-radius:24px;overflow:hidden;pointer-events:auto;display:flex;flex-direction:column;resize:both;animation:appear .24s ease-out}.window.focused{border-color:rgba(183,211,255,.35);box-shadow:0 24px 95px rgba(0,0,0,.46)}@keyframes appear{from{opacity:0;transform:translateY(15px) scale(.97)}to{opacity:1;transform:none}}.titlebar{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:54px;border-bottom:1px solid var(--stroke);cursor:grab;touch-action:none}.titlebar:active{cursor:grabbing}.traffic{display:flex;gap:7px}.traffic button{width:12px;height:12px;border:0;border-radius:50%;padding:0}.close{background:#f07b78}.min{background:#efc56d}.max{background:#70c99a}.wtitle{font-size:13px;font-weight:650;margin:auto;color:#e9edf5}.content{padding:19px;overflow:auto;flex:1;user-select:text}.content h2{font-size:21px;font-weight:600;letter-spacing:-.5px;margin:0 0 14px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{background:rgba(255,255,255,.085);border:1px solid var(--stroke);border-radius:13px;padding:11px 14px;font-size:13px}.btn:hover{background:rgba(255,255,255,.16)}.primary{background:var(--accent);color:#101727;border-color:transparent;font-weight:650}.primary:hover{background:#c2d9ff}.input{background:rgba(0,0,0,.19);border:1px solid var(--stroke);border-radius:13px;color:white;padding:12px;width:100%;outline:none}textarea.input{height:calc(100% - 42px);min-height:140px;resize:none;line-height:1.55}.tilegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:13px}.tile{border:1px solid var(--stroke);background:rgba(255,255,255,.05);border-radius:17px;padding:17px 8px;display:grid;gap:10px;justify-items:center;font-size:12px}.tile:hover{background:rgba(255,255,255,.11)}.tile .glyph{font-size:27px;color:var(--accent)}.setting{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--stroke);font-size:13px}.setting input[type=range]{width:145px;accent-color:var(--accent)}.setting select{background:#1d2532;color:white;border:1px solid var(--stroke);padding:7px;border-radius:9px}.badge{padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.07);font-size:11px}.hand-dot{position:fixed;width:19px;height:19px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 6px rgba(164,200,255,.15),0 0 20px rgba(164,200,255,.5);pointer-events:none;z-index:1000;transform:translate(-50%,-50%);display:none;transition:width .1s,height .1s}.hand-dot.pinch{background:var(--accent);width:27px;height:27px}.hand-dot.second{border-color:#f5c5a8;box-shadow:0 0 0 6px rgba(245,197,168,.15)}#camera{position:fixed;right:16px;bottom:105px;width:160px;border-radius:16px;overflow:hidden;z-index:90;display:none;border:1px solid var(--stroke);background:#090d16}#camera video{width:100%;display:block;transform:scaleX(-1)}#camera small{position:absolute;bottom:6px;left:8px;font-size:10px;text-shadow:0 1px 5px black}.hint{font-size:12px;color:var(--muted);line-height:1.6}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc button{height:47px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);border-radius:12px;font-size:18px}.calc button:hover{background:rgba(255,255,255,.16)}.clock{font-size:clamp(34px,7vw,54px);letter-spacing:-2px;font-weight:300;font-variant-numeric:tabular-nums}#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);padding:12px 18px;border-radius:14px;z-index:300;display:none;max-width:90vw;text-align:center;font-size:13px}.list-item{padding:11px;border-radius:12px;border:1px solid var(--stroke);margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}#fileinput{display:none}@media(max-width:620px){#top{left:10px;right:10px}.brand,.status{padding:10px 11px;font-size:11px}#dock{padding:7px;gap:0}.dockbtn{min-width:53px;font-size:9px}.window{max-width:calc(100vw - 32px);max-height:60vh;resize:none}.content{padding:15px}#camera{width:115px;bottom:100px}#welcome{top:40%}}
</style>
</head>
<body>
<div id="space"><video id="worldVideo" autoplay muted playsinline></video><div id="worldShade"></div><div id="worldHint">APONTE A CÂMERA PARA O AMBIENTE</div></div>
<div id="top"><div class="brand glass"><b>◈</b> VR OS <span class="muted">SPATIAL</span></div><button id="recenterButton" type="button" title="Recentrar janelas na sua frente">◎ Recentrar</button><div id="trackingStatus" class="status glass">● Aguardando câmera</div></div>
<div id="welcome"><h1>Seu ambiente é o sistema.</h1><p>Abra a câmera e posicione suas janelas no mundo ao redor.</p><button id="startReality" class="btn primary" style="pointer-events:auto;margin-top:22px;padding:15px 25px">Iniciar realidade mista</button><p id="realityMessage" class="hint" style="margin-top:15px"></p></div>
<div id="worldStage"><div id="windows"></div>
<div id="dock" class="glass spatialDock">
<button class="dockbtn" data-open="home" title="Início">⌂<span>Início</span></button>
<button class="dockbtn" data-open="launcher" title="Aplicativos">▦<span>Apps</span></button>
<button class="dockbtn" data-open="notes" title="Notas">▤<span>Notas</span></button>
<button class="dockbtn" data-open="hands" title="Rastreamento">✋<span>Mãos</span></button>
<button class="dockbtn" data-open="settings" title="Ajustes">⚙<span>Ajustes</span></button>
</div>
</div>
<div id="camera"><video id="video" autoplay muted playsinline></video><small id="cameraLabel">Câmera ativa</small></div>
<canvas id="handOverlay" aria-hidden="true"></canvas><div id="hand1" class="hand-dot"></div><div id="hand2" class="hand-dot second"></div>
<div id="toast" class="glass" role="status"></div>
<input id="fileinput" type="file" multiple>
<style>
#space{background:#05080d;overflow:hidden}#worldVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}#worldShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,9,17,.26),transparent 24%,transparent 70%,rgba(3,7,12,.32));pointer-events:none}#worldHint{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:10px;letter-spacing:2px;color:#aab9c9;opacity:.6;text-align:center;width:90%;pointer-events:none}.orb{display:none}#worldStage{position:fixed;inset:0;perspective:1250px;pointer-events:none;transform-style:preserve-3d}#windows{position:absolute;inset:0;transform-style:preserve-3d}.window{transform-origin:center center;transform:perspective(1250px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg)) translateZ(var(--depth,0px));background:rgba(19,25,35,.78);border:1px solid rgba(225,237,255,.27);box-shadow:0 18px 60px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.14);border-radius:25px}.window.focused{border-color:rgba(211,232,255,.6);box-shadow:0 20px 75px rgba(0,0,0,.46),0 0 25px rgba(175,214,255,.09)}.window:after{content:"";position:absolute;bottom:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);pointer-events:none}.spatialDock{background:rgba(22,29,40,.75);border-radius:28px;box-shadow:0 10px 40px #0008,0 0 0 1px #fff1;transform:translateX(-50%) perspective(600px) rotateX(7deg)!important}#top .brand,#top .status{background:rgba(20,27,39,.63)}#welcome{z-index:5}body.reality #welcome{display:none}body.reality #worldHint{display:none}body.reality #worldVideo{display:block}body:not(.reality) #dock{opacity:.3;pointer-events:none}body:not(.reality) #windows{opacity:0;pointer-events:none}.window .titlebar{background:rgba(255,255,255,.035)}#worldBadge{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translateX(-50%);z-index:101;pointer-events:none;color:white;font-size:11px;background:rgba(10,20,29,.5);padding:9px 13px;border:1px solid #ffffff24;border-radius:18px;display:none;white-space:nowrap}body.reality #worldBadge{display:block}#windows{transition:transform .12s linear}#dock{max-width:calc(100vw - 24px)}#recenterButton{pointer-events:auto;display:none;background:rgba(20,28,39,.72);border:1px solid #ffffff33;padding:9px 13px;border-radius:14px;font-size:12px}body.reality #recenterButton{display:block}#handOverlay{position:fixed;inset:0;width:100%;height:100%;z-index:210;pointer-events:none;display:none}body.handTracking #handOverlay{display:block}#worldStage{will-change:transform}#worldStage .spatialDock{pointer-events:auto;bottom:calc(17px + env(safe-area-inset-bottom));}body:not(.reality) #worldStage{pointer-events:none}#worldStage.no-motion{transform:none!important}#worldVideo:fullscreen{object-fit:cover}@media(max-width:620px){.window{height:min(49vh,480px);border-radius:25px}.window .content{font-size:14px}#welcome{top:46%}#worldBadge{top:calc(79px + env(safe-area-inset-top))}}
</style>
<div id="worldBadge">◉ Passagem de câmera · modo experimental</div>
<script type="module">
const $=s=>document.querySelector(s), root=$("#windows"), welcome=$("#welcome"), status=$("#trackingStatus");
const icons={home:"⌂",launcher:"▦",notes:"▤",hands:"✋",settings:"⚙",clock:"◷",calc:"⌗",files:"▱",gallery:"▧",spaces:"▣"};
const titles={home:"Início",launcher:"Aplicativos",notes:"Notas",hands:"Rastreamento das mãos",settings:"Ajustes",clock:"Relógio",calc:"Calculadora",files:"Arquivos",gallery:"Galeria",spaces:"Janelas"};
const store=(k,v)=>localStorage.setItem("vros."+k,JSON.stringify(v));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem("vros."+k)??"null")??d}catch{return d}};
const state={reality:false,worldStream:null,orientationBase:null,orientationCurrent:null,viewX:0,viewY:0,hasMotion:false,wins:[],z:20,hand:false,stream:null,tracker:null,frame:0,lastTime:0,pinch:[false,false],cursor:[null,null],activeHand:null,gestureTarget:null,gestureWindow:null,gestureMode:null,handFrames:0,handFps:0,handSensitivity:load("sensitivity",1),showHand:load("showHand",true),mirrored:load("mirrored",false),accent:load("accent","#a4c8ff"),seconds:0,running:false,started:0,files:load("files",[]),gallery:load("gallery",[])};
document.documentElement.style.setProperty("--accent",state.accent);
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function angularDelta(a,b){return ((a-b+540)%360)-180}
function orientationChanged(e){
 if(!state.reality || e.alpha==null || e.beta==null)return;
 state.hasMotion=true;
 state.orientationCurrent={alpha:e.alpha,beta:e.beta};
 if(!state.orientationBase)state.orientationBase={...state.orientationCurrent};
 const yaw=angularDelta(e.alpha,state.orientationBase.alpha),pitch=angularDelta(e.beta,state.orientationBase.beta);
 const targetX=clamp(yaw*3.2,-innerWidth*.35,innerWidth*.35);
 const targetY=clamp(pitch*2.5,-innerHeight*.18,innerHeight*.18);
 state.viewX+=(targetX-state.viewX)*.19;
 state.viewY+=(targetY-state.viewY)*.19;
 $("#windows").style.transform="translate3d("+state.viewX+"px,"+state.viewY+"px,0)";
}
window.addEventListener("deviceorientation",orientationChanged);
$("#recenterButton").onclick=()=>{
 state.orientationBase=state.orientationCurrent?{...state.orientationCurrent}:null;
 state.viewX=0;state.viewY=0;$("#windows").style.transform="translate3d(0,0,0)";
 toast("Janelas recentralizadas");
};
async function startReality(){
 const msg=$("#realityMessage"),btn=$("#startReality");
 btn.disabled=true;btn.textContent="Abrindo câmera...";
 // A solicitação de sensores precisa ser disparada pelo toque do usuário no iOS.
 const orientationPermission=typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"
  ? DeviceOrientationEvent.requestPermission().catch(()=> "denied")
  : Promise.resolve("unavailable");
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("A câmera exige um navegador compatível e HTTPS.");
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:960},height:{ideal:720},frameRate:{ideal:30}},audio:false});
  state.worldStream=stream;
  const video=$("#worldVideo");video.srcObject=stream;await video.play();
  state.reality=true;document.body.classList.add("reality");
  const permission=await orientationPermission;
  $("#trackingStatus").textContent=permission==="denied"?"● Câmera · sem sensores":"● Câmera ativa";
  toast("Câmera iniciada. Aponte para o ambiente e abra os aplicativos.");
  if(!state.wins.length)openApp("launcher");
 }catch(e){
  msg.textContent=e.name==="NotAllowedError"?"Permita a câmera nas configurações do Safari.":(e.message||"Falha ao iniciar câmera.");
  btn.disabled=false;btn.textContent="Tentar novamente";
  state.worldStream?.getTracks().forEach(t=>t.stop());state.worldStream=null;
 }
}
$("#startReality").onclick=startReality;

function toast(msg){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display="none",3400)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function appMarkup(kind){
switch(kind){
case "home":return '<h2>VR OS Spatial</h2><p class="muted">A câmera é seu ambiente. Janelas são projetadas à sua frente; o movimento por sensores é aproximado no navegador.</p><div class="tilegrid">'+["launcher","hands","notes","spaces"].map(k=>'<button class="tile" data-open="'+k+'"><span class="glyph">'+icons[k]+'</span>'+titles[k]+'</button>').join("")+'</div>';
case "launcher":return '<h2>Aplicativos</h2><div class="tilegrid">'+Object.keys(titles).filter(k=>k!=="launcher").map(k=>'<button class="tile" data-open="'+k+'"><span class="glyph">'+icons[k]+'</span>'+titles[k]+'</button>').join("")+'</div>';
case "notes":return '<h2>Suas notas</h2><textarea class="input" id="noteText" placeholder="Comece a escrever...">'+escapeHTML(load("notes",""))+'</textarea><p class="hint">Salvo automaticamente neste navegador.</p>';
case "hands":return '<h2>Controle por gestos</h2><p class="hint">Mostre suas mãos para a câmera traseira, no ambiente à frente do iPhone. Indicador move o cursor; pinça entre indicador e polegar clica ou arrasta. O modelo roda no seu dispositivo. A silhueta na frente dos painéis é aproximada por pontos da mão, não é profundidade real.</p><div class="row"><button class="btn primary" id="handToggle">'+(state.hand?"Desativar câmera":"Ativar rastreamento")+'</button><span id="handInfo" class="badge">'+(state.hand?"Ativo":"Desligado")+'</span></div><div class="setting"><label for="sensitivity">Sensibilidade</label><input id="sensitivity" type="range" min=".5" max="1.7" step=".1" value="'+state.handSensitivity+'"></div><div class="setting"><label for="showHand">Mão na frente das janelas (experimental)</label><input type="checkbox" id="showHand" '+(state.showHand?"checked":"")+'></div><div class="setting"><label for="mirror">Espelhar movimento</label><input type="checkbox" id="mirror" '+(state.mirrored?"checked":"")+'></div><p class="hint">Requer HTTPS, câmera e conexão inicial para carregar o modelo. A ancoragem por sensores é aproximada, não é ARKit. Se não funcionar, use toque ou mouse.</p>';
case "settings":return '<h2>Personalização</h2><div class="setting"><span>Cor de destaque</span><input type="color" id="accent" value="'+state.accent+'"></div><div class="setting"><span>Fundo espacial</span><select id="wallpaper"><option value="space">Espacial</option><option value="night">Noite</option><option value="deep">Profundo</option></select></div><div class="setting"><span>Transparência</span><input id="opacity" type="range" min=".55" max=".96" step=".01" value="'+load("opacity",.74)+'"></div><div class="setting"><span>Redefinir posições</span><button class="btn" id="resetWindows">Organizar</button></div><p class="hint">Suas preferências e notas ficam armazenadas neste navegador.</p>';
case "clock":return '<h2>Relógio</h2><div class="clock" id="liveClock">--:--:--</div><p id="today" class="muted"></p><hr style="border:0;border-top:1px solid var(--stroke);margin:20px 0"><h2>Cronômetro</h2><div class="clock" id="stopwatch">00:00.0</div><div class="row"><button class="btn primary" id="startStop">Iniciar</button><button class="btn" id="resetStop">Zerar</button></div>';
case "calc":return '<h2>Calculadora</h2><input class="input" id="calcScreen" value="0" readonly style="text-align:right;font-size:29px;margin-bottom:12px"><div class="calc">'+["C","(",")","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","⌫","="].map(s=>'<button data-key="'+s+'">'+s+'</button>').join("")+'</div>';
case "files":return '<h2>Arquivos</h2><button class="btn primary" id="importFiles">Importar arquivos</button><button class="btn" id="newFile">Criar texto</button><div id="fileList"></div><p class="hint">Arquivos pequenos ficam salvos localmente; arquivos grandes não são armazenados.</p>';
case "gallery":return '<h2>Galeria</h2><button class="btn primary" id="importPhotos">Adicionar imagens</button><div id="galleryList" class="tilegrid" style="margin-top:15px"></div>';
case "spaces":return '<h2>Janelas abertas</h2><div id="windowList"></div><button class="btn" id="closeAll">Fechar todas</button>';
}}
function saveLayout(){store("layout",state.wins.map(w=>({kind:w.kind,x:w.el.offsetLeft,y:w.el.offsetTop,width:w.el.offsetWidth,height:w.el.offsetHeight,min:w.min})))}
function openApp(kind,opts={}){if(!state.reality){toast("Primeiro inicie a câmera.");return;}
if(!titles[kind])return;
const id="w"+Math.random().toString(36).slice(2), el=document.createElement("section");
el.className="window glass";el.dataset.id=id;el.setAttribute("aria-label",titles[kind]);
const n=state.wins.length;
const width=Math.min(innerWidth-32,innerWidth<620?350:520),height=Math.min(innerHeight*.49,innerWidth<620?380:420);
el.style.left=(opts.x??Math.max(16,(innerWidth-width)/2+(n%3-1)*Math.min(24,innerWidth*.04)))+"px";
el.style.top=(opts.y??Math.max(112,(innerHeight-height)/2-42+(n%3)*17))+"px";
el.style.width=(opts.width??width)+"px";el.style.height=(opts.height??height)+"px";el.style.setProperty("--ry",((n%3)-1)*-5+"deg");el.style.setProperty("--rx",((n%2)?-2:2)+"deg");el.style.setProperty("--depth",((n%3)-1)*-35+"px");
el.innerHTML='<div class="titlebar"><div class="traffic"><button class="close" title="Fechar" aria-label="Fechar"></button><button class="min" title="Minimizar" aria-label="Minimizar"></button><button class="max" title="Maximizar" aria-label="Maximizar"></button></div><span class="wtitle">'+titles[kind]+'</span></div><div class="content">'+appMarkup(kind)+'</div>';
root.appendChild(el);const w={id,kind,el,min:false,old:null};state.wins.push(w);focus(w);welcome.style.display="none";
el.querySelector(".close").onclick=()=>closeWindow(w);
el.querySelector(".min").onclick=()=>{w.min=!w.min;el.querySelector(".content").style.display=w.min?"none":"";el.style.height=w.min?"54px":(w.old?.height||"380px");saveLayout()};
el.querySelector(".max").onclick=()=>{if(!w.old){w.old={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};Object.assign(el.style,{left:"12px",top:"75px",width:"calc(100vw - 24px)",height:"calc(100vh - 165px)"})}else{Object.assign(el.style,w.old);w.old=null}saveLayout()};
el.addEventListener("pointerdown",()=>focus(w));installDrag(w);installApp(w);new ResizeObserver(()=>saveLayout()).observe(el);saveLayout();return w
}
function closeWindow(w){w.el.remove();state.wins=state.wins.filter(v=>v!==w);saveLayout();if(!state.wins.length)welcome.style.display=""}
function focus(w){state.wins.forEach(v=>v.el.classList.remove("focused"));w.el.classList.add("focused");w.el.style.zIndex=++state.z}
function installDrag(w){let start=null;const bar=w.el.querySelector(".titlebar");bar.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;focus(w);start={x:e.clientX,y:e.clientY,left:w.el.offsetLeft,top:w.el.offsetTop};bar.setPointerCapture(e.pointerId);e.preventDefault()});bar.addEventListener("pointermove",e=>{if(!start)return;w.el.style.left=Math.max(0,Math.min(innerWidth-90,start.left+e.clientX-start.x))+"px";w.el.style.top=Math.max(0,Math.min(innerHeight-100,start.top+e.clientY-start.y))+"px"});const done=()=>{if(start)saveLayout();start=null};bar.addEventListener("pointerup",done);bar.addEventListener("pointercancel",done)}
function installApp(w){
const el=w.el, q=s=>el.querySelector(s);
el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openApp(b.dataset.open));
if(w.kind==="notes")q("#noteText").oninput=e=>store("notes",e.target.value);
if(w.kind==="hands"){q("#handToggle").onclick=()=>state.hand?stopHands():startHands();q("#sensitivity").oninput=e=>{state.handSensitivity=+e.target.value;store("sensitivity",state.handSensitivity)};q("#mirror").onchange=e=>{state.mirrored=e.target.checked;store("mirrored",state.mirrored)};q("#showHand").onchange=e=>{state.showHand=e.target.checked;store("showHand",state.showHand)}}
if(w.kind==="settings"){q("#accent").oninput=e=>{state.accent=e.target.value;document.documentElement.style.setProperty("--accent",state.accent);store("accent",state.accent)};q("#opacity").oninput=e=>{document.documentElement.style.setProperty("--glass","rgba(25,31,44,"+e.target.value+")");store("opacity",+e.target.value)};q("#wallpaper").onchange=e=>{const colors={space:"#090d16",night:"#050609",deep:"#071b22"};$("#space").style.background=colors[e.target.value]};q("#resetWindows").onclick=()=>{state.wins.forEach((v,i)=>{v.el.style.left=Math.max(10,innerWidth/2-260+(i%4)*35)+"px";v.el.style.top=Math.max(70,innerHeight/2-200+(i%4)*30)+"px"});saveLayout();toast("Janelas organizadas")}}
if(w.kind==="clock"){const refresh=()=>{if(!el.isConnected)return;const now=new Date();q("#liveClock").textContent=now.toLocaleTimeString("pt-BR");q("#today").textContent=now.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});const ms=state.seconds+(state.running?Date.now()-state.started:0);q("#stopwatch").textContent=String(Math.floor(ms/60000)).padStart(2,"0")+":"+String(Math.floor(ms/1000)%60).padStart(2,"0")+"."+(Math.floor(ms/100)%10);q("#startStop").textContent=state.running?"Pausar":"Iniciar"};refresh();const timer=setInterval(()=>{if(!el.isConnected){clearInterval(timer);return}refresh()},100);q("#startStop").onclick=()=>{if(state.running){state.seconds+=Date.now()-state.started;state.running=false}else{state.started=Date.now();state.running=true}refresh()};q("#resetStop").onclick=()=>{state.running=false;state.seconds=0;refresh()}}
if(w.kind==="calc"){let expr="";q(".calc").onclick=e=>{const b=e.target.closest("[data-key]");if(!b)return;const k=b.dataset.key;if(k==="C")expr="";else if(k==="⌫")expr=expr.slice(0,-1);else if(k==="="){try{const safe=expr.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");if(!/^[0-9+*/().\-\s]+$/.test(safe))throw Error();const result=Function('"use strict";return ('+safe+')')();expr=Number.isFinite(result)?String(+result.toFixed(8)):"Erro"}catch{expr="Erro"}}else{if(expr==="Erro")expr="";expr+=k}q("#calcScreen").value=expr||"0"}}
if(w.kind==="files"){const render=()=>{q("#fileList").innerHTML=state.files.map((f,i)=>'<div class="list-item"><span>'+escapeHTML(f.name)+'</span><span><button class="btn" data-download="'+i+'">Baixar</button> <button class="btn" data-delete="'+i+'">×</button></span></div>').join("")};render();q("#importFiles").onclick=()=>chooseFiles(false,render);q("#newFile").onclick=()=>{const name=prompt("Nome do arquivo:", "nota.txt");if(!name)return;const text=prompt("Conteúdo do arquivo:","")??"";state.files.push({name,text});store("files",state.files);render()};q("#fileList").onclick=e=>{const d=e.target.closest("[data-download]"),del=e.target.closest("[data-delete]");if(d){const f=state.files[+d.dataset.download];downloadText(f.name,f.text)}if(del){state.files.splice(+del.dataset.delete,1);store("files",state.files);render()}}}
if(w.kind==="gallery"){const render=()=>{q("#galleryList").innerHTML=state.gallery.map((img,i)=>'<div class="tile"><img src="'+img+'" style="width:100%;height:90px;object-fit:cover;border-radius:9px"><button class="btn" data-remove="'+i+'">Excluir</button></div>').join("")};render();q("#importPhotos").onclick=()=>chooseFiles(true,render);q("#galleryList").onclick=e=>{const b=e.target.closest("[data-remove]");if(!b)return;state.gallery.splice(+b.dataset.remove,1);try{store("gallery",state.gallery)}catch{}render()}}
if(w.kind==="spaces"){const render=()=>{q("#windowList").innerHTML=state.wins.map(v=>'<div class="list-item"><span>'+icons[v.kind]+' '+titles[v.kind]+'</span><button class="btn" data-focus="'+v.id+'">Abrir</button></div>').join("")};render();q("#windowList").onclick=e=>{const b=e.target.closest("[data-focus]");if(b){const target=state.wins.find(v=>v.id===b.dataset.focus);if(target)focus(target)}};q("#closeAll").onclick=()=>{[...state.wins].forEach(closeWindow)}}
}
function downloadText(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function chooseFiles(images,done){const input=$("#fileinput");input.accept=images?"image/*":"*/*";input.onchange=async()=>{for(const file of input.files){if(images){if(file.size>2e6){toast("Imagem muito grande para salvar localmente");continue}const data=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)});state.gallery.push(data)}else{if(file.size>150000){toast("Arquivo grande demais para armazenamento local");continue}state.files.push({name:file.name,text:await file.text()})}}try{store(images?"gallery":"files",images?state.gallery:state.files)}catch{toast("Armazenamento local cheio")}input.value="";done()};input.click()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b&&!b.closest(".window"))openApp(b.dataset.open)});
document.documentElement.style.setProperty("--glass","rgba(25,31,44,"+load("opacity",.74)+")");
async function startHands(){
if(state.hand)return;
if(!state.reality){toast("Inicie o ambiente antes de ativar os gestos.");return}
if(!state.worldStream){toast("Câmera indisponível.");return}
const button=document.querySelector("#handToggle");if(button){button.disabled=true;button.textContent="Carregando modelo..."}
let stage="Início";
try{
stage="Carregando biblioteca";
const {HandLandmarker,FilesetResolver}=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/vision_bundle.mjs");
stage="Carregando WebAssembly";
const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm");
let tracker;
stage="Inicializando modelo de mãos";
try{tracker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numHands:2,minHandDetectionConfidence:.6,minTrackingConfidence:.55})}catch{tracker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"CPU"},runningMode:"VIDEO",numHands:2})}
if(!state.reality || !state.worldStream || $("#worldVideo").readyState<2)throw new Error("Inicie a câmera do ambiente primeiro.");
state.tracker=tracker;state.hand=true;document.body.classList.add("handTracking");status.textContent="● Gestos ativos";
updateHandButton();state.frame=requestAnimationFrame(trackHands);
toast("Rastreamento ativado. Mostre a mão à câmera traseira.");
}catch(err){
 console.error("VR OS hand tracking",err);
 const reason=String(err?.message||err?.name||err).slice(0,240);
 stopHands();
 const message="Falha em "+(typeof stage!=="undefined"?stage:"inicialização")+": "+reason;
 const info=document.querySelector(".window.focused #handInfo");
 if(info)info.textContent="Erro";
 document.querySelectorAll(".window").forEach(w=>{
  const handInfo=w.querySelector("#handInfo");
  if(handInfo)handInfo.textContent="Erro: "+reason;
 });
 toast(message);
}
}
function updateHandButton(){document.querySelectorAll("#handToggle").forEach(b=>{b.disabled=false;b.textContent=state.hand?"Desativar câmera":"Ativar rastreamento"});document.querySelectorAll("#handInfo").forEach(b=>b.textContent=state.hand?"Ativo":"Desligado")}
function stopHands(){
 state.hand=false;document.body.classList.remove("handTracking");cancelAnimationFrame(state.frame);
 state.tracker?.close();state.tracker=null;
 $("#hand1").style.display=$("#hand2").style.display="none";const overlay=$("#handOverlay");overlay.getContext("2d")?.clearRect(0,0,overlay.width,overlay.height);
 status.textContent=state.reality?"● Câmera ativa":"● Aguardando câmera";
 state.pinch=[false,false];state.gestureTarget=null;state.gestureWindow=null;updateHandButton();
}
const HAND_CONNECTIONS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const HAND_OUTLINE=[0,1,2,3,4,3,2,5,6,7,8,7,6,9,10,11,12,11,10,13,14,15,16,15,14,17,18,19,20,19,18,17,0];
function drawHands(lists,video){
 const canvas=$("#handOverlay"),ctx=canvas.getContext("2d");
 if(!ctx)return;
 const ratio=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio)}
 ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
 const vw=video.videoWidth||640,vh=video.videoHeight||480,scale=Math.max(w/vw,h/vh),rw=vw*scale,rh=vh*scale,ox=(w-rw)/2,oy=(h-rh)/2;
 const point=p=>({x:ox+p.x*rw,y:oy+p.y*rh});
 for(const hand of lists){
  if(!hand)continue;
  const pts=hand.map(point);
  // Approximate silhouette from landmarks, not actual depth/segmentation.
  if(state.showHand){
   const path=new Path2D();const outline=HAND_OUTLINE.map(i=>pts[i]);
   path.moveTo(outline[0].x,outline[0].y);
   for(let j=1;j<outline.length;j++)path.lineTo(outline[j].x,outline[j].y);
   path.closePath();
   ctx.save();ctx.clip(path);ctx.drawImage(video,ox,oy,rw,rh);ctx.restore();
  }
  ctx.lineWidth=2;ctx.strokeStyle="rgba(185,221,255,.7)";ctx.fillStyle="rgba(208,232,255,.88)";
  for(const [a,b] of HAND_CONNECTIONS){ctx.beginPath();ctx.moveTo(pts[a].x,pts[a].y);ctx.lineTo(pts[b].x,pts[b].y);ctx.stroke()}
  for(const p of pts){ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()}
 }
}
function trackHands(){
if(!state.hand)return;
const v=$("#worldVideo"),now=performance.now();
if(v.readyState>=2&&v.currentTime!==state.lastTime){
state.lastTime=v.currentTime;
try{const result=state.tracker.detectForVideo(v,now),hands=result.landmarks||[];
state.handFrames++;if(!state.fpsAt)state.fpsAt=now;if(now-state.fpsAt>1000){state.handFps=Math.round(state.handFrames*1000/(now-state.fpsAt));state.handFrames=0;state.fpsAt=now}
$("#trackingStatus").textContent=hands.length+" mão(s) · "+state.handFps+" FPS";drawHands(hands,v);
for(let i=0;i<2;i++){const dot=$("#hand"+(i+1));if(!hands[i]){dot.style.display="none";state.pinch[i]=false;continue}const lm=hands[i],index=lm[8],thumb=lm[4],dist=Math.hypot(index.x-thumb.x,index.y-thumb.y);
// Com object-fit: cover, o vídeo pode estar recortado. Mapeie landmarks para o recorte real.
const sw=v.videoWidth||640,sh=v.videoHeight||480,scale=Math.max(innerWidth/sw,innerHeight/sh);
const rw=sw*scale,rh=sh*scale,ox=(innerWidth-rw)/2,oy=(innerHeight-rh)/2;
const x=(state.mirrored?1-index.x:index.x)*rw+ox,y=index.y*rh+oy;
const old=state.cursor[i];const alpha=Math.min(.9,Math.max(.16,.43*state.handSensitivity));const point={x:old?old.x+(x-old.x)*alpha:x,y:old?old.y+(y-old.y)*alpha:y};state.cursor[i]=point;
dot.style.display="block";dot.style.left=point.x+"px";dot.style.top=point.y+"px";
const pinching=state.pinch[i]?dist<.085:dist<.052;dot.classList.toggle("pinch",pinching);
if(i===0)handleGesture(point,pinching);state.pinch[i]=pinching;
}
if(!hands.length){state.gestureTarget=null;state.gestureWindow=null;}
}catch(err){console.error("Hand tracking:",err);stopHands();toast("Erro durante rastreamento: "+String(err?.message||err).slice(0,130))}}
state.frame=requestAnimationFrame(trackHands)
}
function handleGesture(point,pinch){
const was=state.pinch[0];
if(pinch&&!was){
const el=document.elementFromPoint(point.x,point.y);state.gestureTarget=el;state.gestureWindow=el?.closest(".window");state.gestureStart={x:point.x,y:point.y,left:state.gestureWindow?.offsetLeft||0,top:state.gestureWindow?.offsetTop||0};state.gestureMode=el?.closest(".titlebar")?"drag":"click";
if(state.gestureWindow)focus(state.wins.find(w=>w.el===state.gestureWindow));
}
if(pinch&&was&&state.gestureMode==="drag"&&state.gestureWindow){const a=state.gestureStart;state.gestureWindow.style.left=Math.max(0,a.left+point.x-a.x)+"px";state.gestureWindow.style.top=Math.max(0,a.top+point.y-a.y)+"px"}
if(!pinch&&was){if(state.gestureMode==="click"&&state.gestureTarget){const el=state.gestureTarget;if(el.matches("button,input[type=checkbox]")||el.closest("button"))(el.closest("button")||el).click();else if(el.matches("input[type=range]")){const r=el.getBoundingClientRect();el.value=+el.min+(+el.max-+el.min)*Math.max(0,Math.min(1,(point.x-r.left)/r.width));el.dispatchEvent(new Event("input",{bubbles:true}))}}saveLayout();state.gestureTarget=null;state.gestureWindow=null}
}
window.addEventListener("beforeunload",()=>{stopHands();state.worldStream?.getTracks().forEach(t=>t.stop())});
/* The camera-first spatial workspace is started by the user. */
</script>
