<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="VR OS — seu espaço de trabalho em realidade mista experimental.">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>VR OS — Spatial</title>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V6a2 2 0 0 1 4 0v4-7a2 2 0 0 1 4 0v7-5a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.5-2.7l-3.2-4a2 2 0 0 1 3.1-2.5L8 14"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M8 7h8M8 12h2m4 0h2m-8 4h2m4 0h2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m4 18 6-6 4 3 3-4 4 5"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17V5l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="i-windows" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="14" rx="2"/><path d="M8 4h12a2 2 0 0 1 2 2v12"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4zM12 15v7"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6m4-6v6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14"/></symbol>
  </svg>

  <div id="scene"><video id="cameraVideo" autoplay muted playsinline></video><div class="camera-vignette"></div><div id="worldLayer"></div></div>

  <header id="topbar" class="glass" role="banner">
    <div class="brand"><span class="brandmark">◇</span><span>VR OS</span><small>SPATIAL 2.3</small></div>
    <span id="trackState" class="track-state"><span class="led"></span> Aguardando câmera</span>
    <div class="topactions">
      <button id="quickLens" type="button" class="iconbtn" title="Alternar câmera 0,5x e traseira" aria-label="Trocar câmera"><svg><use href="#i-camera"/></svg></button>
      <button id="recenter" type="button" class="iconbtn" title="Recentrar todas as janelas" aria-label="Recentrar janelas"><svg><use href="#i-focus"/></svg></button>
      <button id="quickApps" type="button" class="iconbtn" title="Aplicativos" aria-label="Abrir aplicativos"><svg><use href="#i-grid"/></svg></button>
      <button id="quickSettings" type="button" class="iconbtn" title="Configurações" aria-label="Configurações"><svg><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <div id="dock" class="glass" role="toolbar" aria-label="Dock espacial"></div>

  <section id="welcome" class="glass" aria-labelledby="welcomeTitle">
    <div class="welcome-mark">◇</div>
    <div class="eyebrow">SISTEMA ESPACIAL</div>
    <h1 id="welcomeTitle">O ambiente vira sua tela.</h1>
    <p>Janelas que acompanham a direção do iPhone, câmera traseira e controle por gestos.</p>
    <button id="start" class="button primary large" type="button"><svg><use href="#i-camera"/></svg> Iniciar câmera e espaço</button>
    <p class="helper">Use o iPhone na horizontal. O acesso à câmera e ao movimento será solicitado pelo Safari.</p>
    <p id="startError" class="error" role="alert"></p>
  </section>

  <div id="rotateHint" role="status"><svg><use href="#i-focus"/></svg> Melhor experiência: iPhone na horizontal</div>
  <div id="handCursor1" class="hand-cursor" aria-hidden="true"></div><div id="handCursor2" class="hand-cursor second" aria-hidden="true"></div>
  <canvas id="landmarkCanvas" aria-hidden="true"></canvas>
  <div id="toast" class="glass" role="status" aria-live="polite"></div>
  <input id="filePicker" type="file" multiple hidden>
  <script type="module" src="./app.js"></script>
</body>
</html>
